run_id: qwenact
run_root_dir: results/Checkpoints
seed: 42
is_debug: false

framework:
  name: QwenOFT
  qwenvl:
    base_vlm: /defaultShare/archive/linpenghan/models/Qwen3.5-0.8B/
    attn_implementation: flash_attention_2
    vl_hidden_dim: 1024
    preprocess_in_dataloader: true

  action_model:
    action_model_type: MLP
    action_dim: 7
    action_horizon: 16
  motion:
    mode: compat
    loss_weight: 2.0

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: false
    data_root_dir: playground/Datasets/OXE_LEROBOT_DATASET
    data_mix: bridge
    CoT_prompt: >-
      Your task is {instruction}. To identify the key objects for your task.
      Locate their bounding boxes in [x1,y1,x2,y2] format.
    per_device_batch_size: 16
    obs_image_size: [224, 224]
    video_backend: pyav
    motion_flow_root: /defaultShare/archive/linpenghan/cvpr27/flow_cache/

trainer:
  max_train_steps: 100000
  num_warmup_steps: 5000
  save_interval: 5000
  eval_interval: 100
  learning_rate:
    base: 1e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
    motion_head: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: ''
  logging_frequency: 10
  gradient_clipping: 1.0

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
